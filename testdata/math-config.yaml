    name: Number Bounds to 10
    enabled: true
    config:
      - operation: '10 - {a}'
        displayText: 'x + {a} = 10'
        vars:
          a: '1..10'
        answerConstraint: '0..9'
      - operation: '10 - {a}'
        displayText: '{a} + x = 10'
        vars:
          a: '1..10'
        answerConstraint: '0..9'
      - operation: '10 - {a}'
        displayText: '10 - {a} = x'
        vars:
          a: '1..10'
        answerConstraint: '0..9'
    reuseAnswers: false
    answerCount: 6
  tensandones1:
