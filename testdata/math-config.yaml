        vars:
          a: '1..100'
          b: '1..9'
        answerConstraint: '1..9'
      - operation: '{d}'
        displayText: '{c} is x tens and {b} ones'
        vars:
          a: '0..90:10'
          b: '1..9'
        calculated:
          c: '{a} + {b}'
          d: '{a} / 10'
        answerConstraint: '1..9'

