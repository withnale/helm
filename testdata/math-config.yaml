# Section structure (references test IDs)
sections:
  - id: number-bonds
    name: Number Bonds
    color: green
    subsections:
      - name: Simple Addition and Subtraction
        tests:
          - addition-within-10
          - subtraction-within-10
          - addition-within-20
          - subtraction-within-20

      - name: Working with Tens
        tests:
          - know-10-and-1
          - add-digit-to-multiple-of-10
          - xxx-add-x0s
          - xxx-sub-x0s

      - name: Adding exact numbers
        tests:
          - add-1x-to-multiple-of-10
          - xxx-add-8
          - xxx-add-9
          - xxx-add-11
          - xxx-add-12
          - add-3-single-digit

      - name: Adding and Subtracting
        tests:
          - addition-and-subtraction-within-20
          - xxx-addsub-x0s
          - xxx-addsub-9
          - add-x-to-x0

  - id: add-subtract
    name: Add and Subtract
    color: yellow
    subsections:
      - name: Adding - Simple
        tests:
          - add-10
          - add-nearly-10a
          - add-nearly-10b
          - add-y-to-xx
          - add-1y-to-xx
          - adding-columns

      - name: Subtract - Simple
        tests:
          - sub-10
          - sub-nearly-10a
          - sub-nearly-10b


  - id: multiply-divide
    name: Multiply and Divide
    color: orange
    subsections:
      - name: Up to 12
        tests:
          - times-tables-2
          - times-tables-3
          - times-tables-5
          - times-tables-10
          - times-tables-12


  - id: towards
    name: Working Towards
    color: green
    subsections:
      - name: Number Bonds and Partitioning
        tests:
          - numberbonds1
          - tensandones1
          - tensandones2
          - multiples-of-10

  - id: expected
    name: Expected Standard
    color: yellow
    subsections: []

  - id: greater-depth
    name: Greater Depth
    color: orange
    subsections: []
