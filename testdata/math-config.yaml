# Math Slayer Test Configuration
#
# STRUCTURE:
#   1. defaults     - Global settings (timeLimit, answerCount)
#   2. definitions  - Test details (name, enabled, config) indexed by test ID
#   3. sections     - Navigation structure (just references test IDs)
#
# BENEFITS:
#   - Test details defined once, referenced many times
#   - Easy to enable/disable tests globally
#   - Clean separation of content vs. structure
#   - Sections block stays short and readable
#
# CONFIG OPTIONS:
#   - operation: Math expression (e.g., '{a} + {b}', '{a} % {b}', '({a} + {b}) * 2')
#     Supported operators: +, -, *, /, % (modulo)
#     Supports brackets/parentheses for grouping
#   - vars: Variable ranges (e.g., a: '1..10', b: '1..5:2')
#     Also supports comma-separated values (e.g., c: '2,4,6,8' picks randomly from that set)
#     Variables are evaluated in order, so later vars can reference earlier ones (e.g., b: '{a}..20')
#   - calculated: Computed variables evaluated after vars (e.g., sum: '{a} + {b}')
#     Evaluated in order, can reference both random vars and earlier calculated vars
#     Can be used in operation, displayText, or answerConstraint
#   - answerConstraint: Valid answer range (e.g., '1..20')
#   - timeLimit: Time limit in seconds (overrides default)
#   - answerCount: Number of answer buttons (overrides default)
#   - sort: true/false - Sort answers in ascending order (default: false, shuffled)
#   - reuseAnswers: true/false - Keep same answers, generate questions matching them (default: false)

# Global defaults (can be overridden per test)
reporting:
  version: 'v2.7.0-78-geddec698'
  enabled: false
  url: 'http://localhost:8080/report'

defaults:
  timeLimit: 60
  answerCount: 12
  questionSize: large

# Test definitions (indexed by test ID)
definitions:
  numberbonds1:
    name: Number Bounds to 10
    enabled: true
    config:
      - operation: '10 - {a}'
        displayText: 'x + {a} = 10'
        vars:
          a: '1..10'
        answerConstraint: '0..9'
      - operation: '10 - {a}'
        displayText: '{a} + x = 10'
        vars:
          a: '1..10'
        answerConstraint: '0..9'
      - operation: '10 - {a}'
        displayText: '10 - {a} = x'
        vars:
          a: '1..10'
        answerConstraint: '0..9'
    reuseAnswers: false
    answerCount: 6
  tensandones1:
    name: Tens and Ones [1]
    enabled: true
    config:
      - operation: '{a} - {b} * 10'
        displayText: '{a} is {b} tens and x ones'
        vars:
          a: '1..100'
          b: '1..9'
        answerConstraint: '1..9'
      - operation: '{d}'
        displayText: '{c} is x tens and {b} ones'
        vars:
          a: '0..90:10'
          b: '1..9'
        calculated:
          c: '{a} + {b}'
          d: '{a} / 10'
        answerConstraint: '1..9'

    reuseAnswers: false
    answerCount: 6
    sort: true


  tensandones2:
    name: Tens and Ones [2]
    enabled: true
    config:
      - operation: '{a} - {b} * 10'
        displayText: '{a} is {b} tens and x ones'
        vars:
          a: '1..100'
          b: '1..9'
        answerConstraint: '1..9'
      - operation: '{a} - {b} * 10'
        displayText: '{a} is {b} tens and x ones'
        vars:
          a: '1..100'
          b: '1..9'
        answerConstraint: '11..19'
      - operation: '{d}'
        displayText: '{c} is x tens and {b} ones'
        vars:
          a: '0..90:10'
          b: '1..9'
        calculated:
          c: '{a} + {b}'
          d: '{a} / 10'
        answerConstraint: '1..9'
      - operation: '{d}'
        displayText: '{c} is x tens and {b} ones'
        vars:
          a: '0..80:10'
          b: '11..19'
        calculated:
          c: '{a} + {b}'
          d: '{a} / 10'
        answerConstraint: '1..9'

    reuseAnswers: false
    answerCount: 6
    sort: true

  multiples-of-10:
    name: Multiples of 10
    enabled: true
    questionSize: medium
    config:
      - operation: '{d} + 0'
        displayText: '{a}, {b}, {c}, x, {e}'
        vars:
          a: '10..60:10'
          l: '2,5,10'
        calculated:
          b: '{a} + {l}'
          c: '{a} + (2 * {l})'
          d: '{a} + (3 * {l})'
          e: '{a} + (4 * {l})'
        answerConstraint: '30..100:10'
      - operation: '{b}'
        displayText: '{e}, {d}, {c}, x, {a}'
        vars:
          a: '10..60:10'
          l: '10'
        calculated:
          b: '{a} + {l}'
          c: '{a} + (2 * {l})'
          d: '{a} + (3 * {l})'
          e: '{a} + (4 * {l})'
        answerConstraint: '10..100:10'
    reuseAnswers: false
    answerCount: 6
    sort: true


  add-3-single-digit:
    name: Add 3 single digits
    enabled: true
    config:
      - operation: '{a} + {b} + {c}'
        vars:
          a: '1..5'
          b: '1..5'
          c: '1..5'
        answerConstraint: '1..15'
    reuseAnswers: true
  make-10:
    name: Make 10
    enabled: false

  addition-within-10:
    name: Addition within 10
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '0..10'
          b: '0..10'
        answerConstraint: '0..10'
    answerCount: 11
    reuseAnswers: true
    sort: true

  subtraction-within-10:
    name: Subtraction within 10
    enabled: true
    config:
      - operation: '{a} - {b}'
        vars:
          a: '0..10'
          b: '0..10'
        answerConstraint: '0..10'
    answerCount: 11
    reuseAnswers: true
    sort: true


  doubles-to-10:
    name: Doubles to 10
    enabled: true
    config:
      - operation: '{a} + {a}'
        vars:
          a: '1..9'
        answerConstraint: '2..10'

  xxx-add-x0s:
    name: Add multiple of 10
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '1..100'
          b: '10..90:10'
        answerConstraint: '1..100'
    reuseAnswers: true
    sort: true

  xxx-sub-x0s:
    name: Subtract multiple of 10
    enabled: true
    config:
      - operation: '{a} - {b}'
        vars:
          a: '1..100'
          b: '10..90:10'
        answerConstraint: '1..100'
    reuseAnswers: true
    sort: true

  xxx-addsub-x0s:
    name: Add or Subtract multiple of 10
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '1..100'
          b: '10..90:10'
        answerConstraint: '1..100'
      - operation: '{a} - {b}'
        vars:
          a: '1..100'
          b: '10..90:10'
        answerConstraint: '1..100'


  xxx-add-9:
    name: Adding 9
    enabled: true
    config:
      - operation: '{a} + 9'
        vars:
          a: '1..100'
        answerConstraint: '1..100'
    reuseAnswers: true
    sort: true

  xxx-sub-9:
    name: Subtracting 9
    enabled: true
    config:
      - operation: '{a} - 9'
        vars:
          a: '1..100'
        answerConstraint: '1..100'
    reuseAnswers: true
    sort: true


  xxx-addsub-9:
    name: Add or Subtract 9
    enabled: true
    config:
      - operation: '{a} + 9'
        vars:
          a: '1..100'
        answerConstraint: '1..100'
      - operation: '{a} - 9'
        vars:
          a: '1..100'
        answerConstraint: '1..100'
    reuseAnswers: true

  add-x-to-x0:
    name: Add X to multiple of 10
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '0..9'
          b: '10..90:10'
        answerConstraint: '1..100'
      - operation: '{b} + {a}'
        vars:
          a: '0..9'
          b: '10..90:10'
        answerConstraint: '1..100'
    reuseAnswers: true
    sort: true



  make-20:
    name: Make 20
    enabled: false

  addition-within-20:
    name: Addition within 20
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '0..20'
          b: '0..20'
        answerConstraint: '0..20'
    reuseAnswers: true
    sort: true

  subtraction-within-20:
    name: Subtraction within 20
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '0..20'
          b: '0..20'
        answerConstraint: '0..20'
    reuseAnswers: true
    sort: true

  know-10-and-1:
    name: Know 10s and 1s
    enabled: true
    config:
      - operation: '{a} / 10'
        displayText: 'Tens for {a}'
        vars:
          a: '10..99'
        answerConstraint: '0..9'
      - operation: '{a} % 10'
        displayText: 'Ones for {a}'
        vars:
          a: '10..99'
        answerConstraint: '0..9'
    sort: true


  add-digit-to-multiple-of-10:
    name: Add digit to multiple of 10
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '0..90:10'
          b: '0..9'
        answerConstraint: '0..99'

  add-1x-to-multiple-of-10:
    name: Add 1X to multiple of 10
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '0..90:10'
          b: '11..19'
        answerConstraint: '0..99'


  addition-and-subtraction-within-20:
    name: Addition & Subtraction within 20
    enabled: true
    config:
      - operation: '{a} + {b}'
        vars:
          a: '0..20'
          b: '0..20'
        answerConstraint: '0..20'
      - operation: '{a} - {b}'
        vars:
          a: '0..20'
          b: '0..20'
        answerConstraint: '0..20'

  u-plus-u-plus-u:
    name: U + U + U
    enabled: false

  make-100-tens:
    name: Make 100 (tens)
    enabled: false

  make-100:
    name: Make 100
    enabled: false

  addition-within-100-tens:
    name: Addition within 100 (tens)
    enabled: false

  subtraction-within-100-tens:
    name: Subtraction within 100 (tens)
    enabled: false

  make-1-1dp:
    name: Make 1 (1 dp)
    enabled: false

  make-10-1dp:
    name: Make 10 (1 dp)
    enabled: false

  times-tables-12:
    name: Times Tables up to 12
    enabled: true
    config:
      - vars:
          a: '1..12'
          b: '1..12'
        operation: '{a} * {b}'

# Section structure (references test IDs)
sections:
  - id: number-bonds
    name: Number Bonds
    color: green
    subsections:
      - name: Simple Addition and Subtraction
        tests:
          - addition-within-10
          - subtraction-within-10
          - addition-within-20
          - subtraction-within-20

      - name: Working with Tens
        tests:
          - know-10-and-1
          - add-digit-to-multiple-of-10
          - xxx-add-x0s
          - xxx-sub-x0s

      - name: Up to 100
        tests:
          - add-1x-to-multiple-of-10
          - xxx-add-9
          - xxx-sub-9
          - add-3-single-digit

      - name: Adding and Subtracting
        tests:
          - addition-and-subtraction-within-20
          - xxx-addsub-x0s
          - xxx-addsub-9
          - add-x-to-x0

  - id: times-tables
    name: Times Tables
    color: orange
    subsections:
      - name: Up to 12
        tests:
          - times-tables-12

  - id: doubles
    name: Doubles
    color: yellow
    subsections: []

  - id: towards
    name: Working Towards
    color: green
    subsections:
      - name: Number Bonds and Partitioning
        tests:
          - numberbonds1
          - tensandones1
          - tensandones2
          - multiples-of-10

  - id: expected
    name: Expected Standard
    color: yellow
    subsections: []

  - id: greater-depth
    name: Greater Depth
    color: orange
    subsections: []
